# Render blueprint: despliega la app como Web Service con Docker.
# Uso: conecta el repo en Render (Blueprint) y crea el servicio.
services:
  - type: web
    name: mapa-sticker
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      # SQLite (plan free): sin disco persistente el archivo se pierde en cada
      # redeploy, así que solo sirve para pruebas. Para datos durables usa
      # PostgreSQL (ver abajo).
      - key: DB_DRIVER
        value: sqlite
      - key: DATABASE_URL
        value: ./data/mapa-sticker.db
      # Para datos durables (recomendado): PostgreSQL gratuito de Supabase/Neon.
      # Comenta las dos de arriba y usa:
      # - key: DB_DRIVER
      #   value: postgres
      # - key: DATABASE_URL
      #   value: postgresql://usuario:password@host.supabase.co:5432/postgres
      # - key: DB_SSL
      #   value: "true"
      #
      # Storage de imagenes en Supabase Storage (evita perderlas con el disco
      # efimero de Render). Crea un bucket publico "mapa-sticker" con politicas
      # de lectura publica y de escritura para el service role (ver .env.example).
      - key: SUPABASE_STORAGE
        value: "true"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: mapa-sticker

