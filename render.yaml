# Render blueprint: despliega la app como Web Service con Docker.
# Uso: conecta el repo en Render (Blueprint) y crea el servicio.
services:
  - type: web
    name: mapa-sticker
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      # SQLite (plan free): sin disco persistente el archivo se pierde en cada
      # redeploy, así que solo sirve para pruebas. Para datos durables usa
      # PostgreSQL (ver abajo).
      - key: DB_DRIVER
        value: sqlite
      - key: DATABASE_URL
        value: ./data/mapa-sticker.db
      # Para datos durables (recomendado): PostgreSQL gratuito de Supabase/Neon.
      # Comenta las dos de arriba y usa:
      # - key: DB_DRIVER
      #   value: postgres
      # - key: DATABASE_URL
      #   value: postgresql://usuario:password@host.supabase.co:5432/postgres

# databases:
#   - name: mapa-sticker-db
#     plan: free
